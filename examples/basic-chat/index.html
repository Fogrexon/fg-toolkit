<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Chat - FunctionGemma</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .message {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 20px;
            max-width: 80%;
        }

        .user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .model {
            background-color: #f1f0f0;
            color: black;
            align-self: flex-start;
            margin-right: auto;
        }

        #input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
        }

        #status {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <h1>Basic Chat</h1>
    <div id="status">Status: Initializing...</div>
    <div id="chat-history"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." disabled />
        <button id="send-btn" disabled>Send</button>
    </div>
    <script type="module" src="./main.ts"></script>
</body>

</html>
