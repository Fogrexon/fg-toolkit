<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine-tuned FunctionGemma Chat</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 1rem 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.25rem; }
        #status { font-size: 0.875rem; color: var(--text-muted); }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }
        .message.model {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 0.25rem;
        }
        .message.system {
            align-self: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
        }
        .tool-call {
            font-family: monospace;
            background: #000;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            border: 1px solid #334155;
            color: #10b981;
        }

        #input-area {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 1rem;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: white;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0 1.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <header>
        <h1>Fine-tuned FunctionGemma</h1>
        <div id="status">Status: Loading model...</div>
    </header>
    
    <div id="chat-container">
        <div class="message system">The model is fine-tuned to choose between Search Knowledge Base and Google Search.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
